<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width", initial-scale="1">
    <title>AI Meeting Summary</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>

    <div class="meeting-container">

    <!-- LEFT SIDE -->
    <div class="meeting-input">

        <!-- Upload Area -->
        <div class="upload-section">
            <div class="upload-box">
                <div class="upload-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="currentColor" class="bi bi-cloud-upload" viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M4.406 1.342A5.53 5.53 0 0 1 8 0c2.69 0 4.923 2 5.166 4.579C14.758 4.804 16 6.137 16 7.773 16 9.569 14.502 11 12.687 11H10a.5.5 0 0 1 0-1h2.688C13.979 10 15 8.988 15 7.773c0-1.216-1.02-2.228-2.313-2.228h-.5v-.5C12.188 2.825 10.328 1 8 1a4.53 4.53 0 0 0-2.941 1.1c-.757.652-1.153 1.438-1.153 2.055v.448l-.445.049C2.064 4.805 1 5.952 1 7.318 1 8.785 2.23 10 3.781 10H6a.5.5 0 0 1 0 1H3.781C1.708 11 0 9.366 0 7.318c0-1.763 1.266-3.223 2.942-3.593.143-.863.698-1.723 1.464-2.383"/>
                        <path fill-rule="evenodd" d="M7.646 4.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 5.707V14.5a.5.5 0 0 1-1 0V5.707L5.354 7.854a.5.5 0 1 1-.708-.708z"/>
                    </svg>
                </div>

                <h2>Upload Transcript File</h2>
                <p>Drag and drop your file here, or click to browse</p>

                <button class="choose-file-btn">
                    Choose File
                </button>
                <input type="file" id="file-hidden-input" style="display: none;" />
            </div>

            <div class="upload-info">
                <span>Supported formats: .txt, .docx</span>
                <span>Max file size: 2 MB</span>
            </div>
        </div>


        <!-- Uploaded File -->
        <div class="uploaded-file-card">

            <div class="file-header">
                <h3>Uploaded File</h3>

                <button class="remove-btn">
                    Remove
                </button>
            </div>

            <div class="file-content"></div>
        </div>


    </div>


    <!-- RIGHT SIDE -->
    <div class="summary-panel">

        <div class="summary-header">

            <div class="summary-title">
                <span class="sparkle">✦</span>
                <h2>Summary</h2>
            </div>

            <div class="summary-actions">
                <button>▣ Copy</button>
                <button class="pdf-button">↓ Download</button>
            </div>

        </div>

        <div class="summary-container"></div>

    </div>

</div>

<script src="js/runtime-config.js" type="text/javascript"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js"></script>
<script src="js/script.js" type="module"></script>
<script src="js/pdf.js" type="module"></script>

</body>
</html>
